name: Security CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-security-tests:
    name: Backend Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: suzihouse-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: suzihouse-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run security unit tests
        env:
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'ci-only-not-for-prod-' }}${{ github.run_id }}
          JWT_SECRET_KEY: ${{ secrets.TEST_JWT_SECRET_KEY || 'ci-only-not-for-prod-' }}${{ github.run_id }}
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
        run: python -m pytest tests/security/ -v --tb=short

  backend-static-analysis:
    name: Backend Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: suzihouse-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        run: bandit -r app/ -f json -o bandit-report.json --severity-level medium || true

      - name: Display bandit results
        if: always()
        run: bandit -r app/ --severity-level medium -f screen || true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: suzihouse-backend/bandit-report.json

  backend-dependency-audit:
    name: Backend Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: suzihouse-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and pip-audit
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --strict || true

  frontend-audit:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: suzi_Mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Run npm audit
        run: npm audit --production || true
